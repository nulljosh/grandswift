name: CI
on: [push, pull_request]
jobs:
  native-shells:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tests/native.mjs
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle assembleDebug lintDebug
        working-directory: apps/android
  qa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swiftc -O -parse-as-library main.swift -o rainjack
      - run: GS_QA=1 ./rainjack
  map-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 tests/osm.py
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-save playwright@1 && npx playwright install --with-deps chromium
      - run: node tests/web.mjs
  city:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - run: node tests/city.mjs
  desktop-build:
    strategy: { fail-fast: false, matrix: { os: [windows-latest, macos-15, ubuntu-latest] } }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
        working-directory: apps/desktop
      - name: Build unpacked app (unsigned)
        shell: bash
        working-directory: apps/desktop
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
        run: npx electron-builder --dir --publish never -c.forceCodeSigning=false -c.mac.notarize=false
  apple-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: apps/apple
      - run: xcodebuild -project VancouverVice.xcodeproj -scheme VancouverVice -destination 'generic/platform=macOS' CODE_SIGNING_ALLOWED=NO build -quiet
        working-directory: apps/apple
      - run: xcodebuild -project VancouverVice.xcodeproj -scheme VancouverVice -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build -quiet
        working-directory: apps/apple
