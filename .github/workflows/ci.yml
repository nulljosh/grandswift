name: CI
on: [push, pull_request]
jobs:
  native-shells:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tests/native.mjs
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle assembleDebug lintDebug
        working-directory: apps/android
  qa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swiftc -O -parse-as-library main.swift -o rainjack
      - run: GS_QA=1 ./rainjack
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-save playwright@1 && npx playwright install --with-deps chromium
      - run: node tests/web.mjs
