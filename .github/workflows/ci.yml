name: CI
on: [push, pull_request]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-shells:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tests/native.mjs
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle assembleDebug lintDebug
        working-directory: apps/android
  qa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swiftc -O -parse-as-library main.swift -o vancouvervice
      - run: GS_QA=1 ./vancouvervice
  map-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 tests/osm.py
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-save playwright@1 && npx playwright install --with-deps chromium
      - run: node tests/web.mjs
  city:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - run: node tests/city.mjs
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet publish apps/windows/VancouverVice.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o out
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: apps/linux/build.sh
  apple-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: apps/apple
      - run: xcodebuild -project VancouverVice.xcodeproj -scheme VancouverVice -destination 'generic/platform=macOS' CODE_SIGNING_ALLOWED=NO build -quiet
        working-directory: apps/apple
      - run: xcodebuild -project VancouverVice.xcodeproj -scheme VancouverVice -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build -quiet
        working-directory: apps/apple
  online:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tests/online.mjs
