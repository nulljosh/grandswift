name: Release apps
on:
  push: { tags: ["v*"] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  desktop:
    strategy: { fail-fast: false, matrix: { os: [windows-latest, ubuntu-latest, macos-15] } }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
        working-directory: apps/desktop
      # signed when the signing secrets exist, unsigned otherwise (still installs, with the usual unknown-developer prompt)
      - name: Build
        shell: bash
        working-directory: apps/desktop
        env:
          HAVE_MAC: ${{ secrets.CSC_LINK != '' }}
          HAVE_WIN: ${{ secrets.WIN_CSC_LINK != '' }}
          CSC_LINK_S: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_S: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK_S: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD_S: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "$RUNNER_OS" = macOS ] && [ "$HAVE_MAC" = true ]; then export CSC_LINK="$CSC_LINK_S" CSC_KEY_PASSWORD="$CSC_KEY_PASSWORD_S"; npm run dist:signed
          elif [ "$RUNNER_OS" = Windows ] && [ "$HAVE_WIN" = true ]; then export WIN_CSC_LINK="$WIN_CSC_LINK_S" WIN_CSC_KEY_PASSWORD="$WIN_CSC_KEY_PASSWORD_S"; npm run dist:signed
          else export CSC_IDENTITY_AUTO_DISCOVERY=false; npx electron-builder --publish never -c.forceCodeSigning=false -c.mac.notarize=false; fi
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
            apps/desktop/dist/*.dmg
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with: { files: "apps/desktop/dist/*.exe\napps/desktop/dist/*.AppImage\napps/desktop/dist/*.deb\napps/desktop/dist/*.dmg" }
  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      # release-signed when the keystore secret exists, debug-signed otherwise so the APK always ships
      - name: Build
        working-directory: apps/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.jks && gradle assembleRelease bundleRelease
          else gradle assembleDebug && mkdir -p app/build/outputs/apk/release && cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/VancouverVice-android.apk; fi
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            apps/android/app/build/outputs/apk/release/*.apk
            apps/android/app/build/outputs/bundle/release/*.aab
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            apps/android/app/build/outputs/apk/release/*.apk
            apps/android/app/build/outputs/bundle/release/*.aab
      - name: Remove release keystore
        if: always()
        run: rm -f apps/android/release.jks
