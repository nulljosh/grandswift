name: GrandSwift
options: { bundleIdPrefix: com.jaybulb, deploymentTarget: { iOS: "17.0", macOS: "14.0" } }
targets:
  GrandSwift:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [App.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaybulb.grandswift.app
        MARKETING_VERSION: 1.3.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Grand Swift
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIStatusBarHidden: YES
        CODE_SIGN_STYLE: Automatic
        ENABLE_APP_SANDBOX[sdk=macosx*]: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS[sdk=macosx*]: YES
