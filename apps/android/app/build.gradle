plugins { id "com.android.application" }

def keys = new Properties()
def keysFile = rootProject.file("keystore.properties")
if (keysFile.exists()) keysFile.withInputStream { keys.load(it) }
android {
    namespace "com.jaybulb.rainjack"
    compileSdk 34
    defaultConfig { applicationId "com.jaybulb.rainjack"; minSdk 24; targetSdk 34; versionCode 1; versionName "1.3.0" }
    signingConfigs {
        release {
            storeFile rootProject.file(keys.getProperty("storeFile", "release.jks"))
            storePassword keys.getProperty("storePassword", System.getenv("ANDROID_STORE_PASSWORD") ?: "")
            keyAlias keys.getProperty("keyAlias", System.getenv("ANDROID_KEY_ALIAS") ?: "")
            keyPassword keys.getProperty("keyPassword", System.getenv("ANDROID_KEY_PASSWORD") ?: "")
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.release }
    }
}
