<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vancouver Vice — Loading</title>
<style>
:root{--bg:#111316;--ink:#f1efe9;--dim:#9a9ea6;--line:#2a2d33;--accent:#c0392b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0a0b0d;color:var(--ink);font:17px/1.55 -apple-system,"SF Pro Text",Helvetica,Arial,sans-serif;overflow:hidden}

.screen{position:relative;width:100vw;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:
  radial-gradient(ellipse at 50% 20%, rgba(192,57,45,.14), transparent 55%),
  linear-gradient(180deg,#0a0b0d 0%,#111316 55%,#0a0b0d 100%);}

/* city silhouette */
.skyline{position:absolute;left:0;right:0;bottom:0;height:38vh;opacity:.55;pointer-events:none}
.skyline svg{width:100%;height:100%;display:block}

/* rain */
.rain{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.drop{position:absolute;top:-10%;width:1px;background:linear-gradient(180deg,transparent,rgba(241,239,233,.35));animation:fall linear infinite}
@keyframes fall{to{transform:translateY(120vh)}}

/* vignette */
.vignette{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 18vw 4vw rgba(0,0,0,.65)}

.content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 24px}

.title{font-size:clamp(42px,9vw,88px);font-weight:800;letter-spacing:-.02em;margin:0;line-height:.95;color:var(--ink);text-shadow:0 2px 30px rgba(192,57,45,.35)}
.title .vice{color:var(--accent)}
.subtitle{margin:10px 0 0;color:var(--dim);font-size:15px;letter-spacing:.14em;text-transform:uppercase}

.tip-box{margin-top:56px;min-height:46px;display:flex;align-items:center;justify-content:center}
.tip{color:var(--ink);font-size:16px;opacity:0;transition:opacity .5s ease;max-width:520px}
.tip.show{opacity:1}
.tip .key{color:var(--accent);font-weight:700}

.progress-wrap{margin-top:34px;width:min(420px,80vw)}
.progress-track{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.progress-fill{height:100%;width:35%;background:var(--accent);border-radius:2px;animation:load 5.5s ease-in-out infinite}
@keyframes load{0%{width:6%}50%{width:78%}100%{width:6%}}
.progress-label{margin-top:10px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);display:flex;justify-content:space-between}

footer.hint{position:absolute;bottom:22px;left:0;right:0;text-align:center;color:var(--dim);font-size:12px;letter-spacing:.08em;text-transform:uppercase;z-index:2}
</style></head>
<body>
<div class="screen">
  <div class="skyline" aria-hidden="true">
    <svg viewBox="0 0 1200 300" preserveAspectRatio="none">
      <polygon points="0,300 0,210 40,210 40,180 80,180 80,220 130,220 130,150 170,150 170,230 220,230 220,190 260,190 260,240 310,240 310,160 350,160 350,210 400,210 400,140 440,140 440,220 500,220 500,170 550,170 550,230 610,230 610,120 650,120 650,200 700,200 700,160 750,160 750,230 810,230 810,180 850,180 850,240 900,240 900,150 950,150 950,210 1000,210 1000,190 1050,190 1050,230 1100,230 1100,170 1150,170 1150,220 1200,220 1200,300" fill="#050607"/>
    </svg>
  </div>
  <div class="rain" id="rain"></div>
  <div class="vignette"></div>

  <div class="content">
    <h1 class="title">Vancouver<br><span class="vice">Vice</span></h1>
    <p class="subtitle">Don't get caught</p>

    <div class="tip-box">
      <p class="tip" id="tip">Loading…</p>
    </div>

    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill"></div></div>
      <div class="progress-label"><span>Streaming Vancouver</span><span>3D tiles</span></div>
    </div>
  </div>

  <footer class="hint">Real Vancouver, streamed live from Google's 3D scan</footer>
</div>

<script>
// decorative rain
(function(){
  var rain = document.getElementById('rain');
  var n = 70;
  for (var i=0;i<n;i++){
    var d = document.createElement('div');
    d.className='drop';
    var left = Math.random()*100;
    var h = 40+Math.random()*90;
    var dur = 0.5+Math.random()*0.6;
    var delay = Math.random()*2;
    d.style.left = left+'vw';
    d.style.height = h+'px';
    d.style.animationDuration = dur+'s';
    d.style.animationDelay = delay+'s';
    rain.appendChild(d);
  }
})();

// rotating tips (visual only, mirrors the timer the real UMG widget will run)
var tips = [
  "Press <span class=\"key\">E</span> near a car to jack it.",
  "<span class=\"key\">Tab</span> switches between Joshua, Ben and Alexandre.",
  "Stars climb when cops see you commit a crime, and drain when you break line of sight.",
  "Mac minis don't fit in a bag. Sell them fast on Granville.",
  "Dad's boat gets you out from under the bridge. He'll ask about his hard drive."
];
var tipEl = document.getElementById('tip');
var i = 0;
function showTip(){
  tipEl.classList.remove('show');
  setTimeout(function(){
    tipEl.innerHTML = tips[i % tips.length];
    tipEl.classList.add('show');
    i++;
  }, 260);
}
showTip();
setInterval(showTip, 4200);
</script>
</body></html>
